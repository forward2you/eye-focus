name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and run motion tests
        run: |
          node --check app.js
          node --input-type=module --check < bounce/app.js
          node --test tests/bounce.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html style.css app.js .nojekyll _site/
          cp -R bounce _site/bounce
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/bounce/index.html _site/bounce/app.js
          if grep -R '__BUILD_VERSION__' _site/bounce; then
            echo "Unresolved asset version in published files"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
