<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#203e2a">
    <meta name="description" content="两分钟弹球跟随演示：一分钟单球、一分钟双球，柔和绿点遇边界反弹。">
    <title>弹球跟随 · Eye Focus</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23203e2a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%239de7af'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app">
      <canvas id="field" role="img" aria-label="柔和绿球以固定速度运动，碰到边界反弹；一分钟后增加第二个球，两分钟后停止。"></canvas>
      <a class="back" href="../">← 点阵版</a>
      <p id="status" role="status" aria-live="polite">单球一分钟，双球一分钟；不适即停</p>
      <footer class="toolbar">
        <span id="phase">单球</span>
        <span id="remaining" role="timer" aria-label="本轮剩余时间" aria-live="off">02:00</span>
        <button id="toggle" type="button" aria-pressed="false">开始跟随</button>
        <button id="fullscreen" class="secondary" type="button">全屏</button>
      </footer>
      <p class="notice">仅为视觉跟随演示，随机不代表疗效更好。如有头疼、眼痛或复视，请立即停止。</p>
      <noscript><p class="script-notice">需要启用 JavaScript 才能播放弹球运动。</p></noscript>
    </main>
  </body>
</html>
